<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agencias de Viaje y Operadores - Guía Turística de Bolivia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .dropdown:hover .dropdown-menu,
    .dropdown:focus-within .dropdown-menu { display: block; }
  </style>
</head>
<body class="bg-[#FBFBFA] text-slate-800 antialiased">

  <!-- NAVBAR REUTILIZABLE -->
  <div id="main-header" data-cta-text="Registrar Agencia"></div>
  <script src="js/header.js"></script>

  <!-- CABECERA DE SECCIÓN -->
  <section class="bg-white border-b border-slate-200 py-10 px-4">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-red-700">Categoría 1 de 6</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">Agencias de Viaje y Operadores</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1 max-w-xl">
          Operadores receptivos, agencias mayoristas, minoristas y consultoras de viaje acreditadas en Bolivia y conexiones internacionales.
        </p>
      </div>
      <div id="total-registros-badge" class="text-xs font-semibold text-slate-500 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 shrink-0">
        Cargando registros...
      </div>
    </div>
  </section>

  <!-- CONTENIDO Y FILTROS -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Filtros de búsqueda y segmentación -->
    <div class="bg-white p-3.5 border border-slate-200 rounded-xl mb-6 grid grid-cols-1 sm:grid-cols-3 gap-3 shadow-sm">
      <div class="relative">
        <input
          id="filtro-busqueda"
          type="text"
          placeholder="Buscar por agencia, representante o destino..."
          class="w-full text-xs pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-slate-400 focus:bg-white text-slate-800 transition-colors"
        >
        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>

      <select id="filtro-tipo" class="text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-slate-400 focus:bg-white text-slate-700 transition-colors">
        <option value="">Todas las modalidades</option>
        <option value="receptivo">Turismo Receptivo</option>
        <option value="mayorista">Mayorista / Emisivo</option>
        <option value="tecnologia">Plataforma / B2B</option>
      </select>

      <select id="filtro-departamento" class="text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-slate-400 focus:bg-white text-slate-700 transition-colors">
        <option value="">Todos los departamentos</option>
        <option value="lapaz">La Paz</option>
        <option value="santacruz">Santa Cruz</option>
        <option value="cochabamba">Cochabamba</option>
        <option value="potosi">Potosí / Uyuni</option>
        <option value="chuquisaca">Chuquisaca / Sucre</option>
        <option value="tarija">Tarija</option>
        <option value="oruro">Oruro</option>
        <option value="beni">Beni / Rurrenabaque</option>
        <option value="pando">Pando</option>
        <option value="internacional">Internacional</option>
      </select>
    </div>

    <!-- Catálogo de Bloques Dinámicos (9 por página) -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="grid-catalogo">
      <!-- Se inyecta dinámicamente mediante js/catalogo-seccion.js -->
    </div>

    <!-- Paginación Dinámica -->
    <div id="paginacion-catalogo"></div>

  </main>

  <!-- FOOTER REUTILIZABLE -->
  <div id="main-footer"></div>
  <script src="js/footer.js"></script>

  <!-- GSAP PARA TRANSICIONES SUAVES -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- DATOS MOCK Y CONTROLADOR DINÁMICO -->
  <script src="data/agencias.js"></script>
  <script src="js/catalogo-seccion.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      CatalogoSeccion.init({
        datos: window.DATOS_AGENCIAS || [],
        contenedorGrid: 'grid-catalogo',
        contenedorPaginacion: 'paginacion-catalogo',
        filtroInputId: 'filtro-busqueda',
        filtroTipoId: 'filtro-tipo',
        filtroDeptId: 'filtro-departamento',
        contadorId: 'total-registros-badge',
        itemsPorPagina: 9,
        colorBadge: 'text-red-700 bg-red-50 border-red-100',
        colorBoton: 'text-red-700 hover:text-red-800'
      });
    });
  </script>

</body>
</html>
